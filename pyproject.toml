[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-records"
version = "0.1.0.dev0"
description = "Local-first personal records management: staged LLM extraction, deterministic verification, human confirmation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.40",
    # v1 is the stable SDK line. v2 is pre-release and intentionally
    # excluded until its API is stable and a migration is deliberate.
    "mcp>=1.27,<2",
    "pypdf>=4.0",
]

[project.scripts]
records = "records.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
